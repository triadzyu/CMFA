port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
mode: rule
allow-lan: true
external-controller: 0.0.0.0:9090
secret: ''
bind-address: '*'
log-level: silent
unified-delay: true
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 15
tcp-concurrent: true
geodata-loader: memconservative
tun:
  enable: true
  mtu: 1500
  device: clash
  stack: system
  dns-hijack:
  - any:53
  - tcp://8.8.8.8:53
  - tcp://8.8.4.4:53
  auto-route: true
  strict-route: false
  auto-redirect: true
  auto-detect-interface: true
profile:
  store-selected: true
  store-fake-ip: false
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: false
  sniff:
    QUIC:
      ports:
      - 443
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  sniffing:
  - tls
  - http
  port-whitelist:
  - 80
  - 443
dns:
  cache-algorithm: arc
  enable: true
  prefer-h3: false
  ipv6: false
  ipv6-timeout: 300
  nameserver:
  - https://dns.google/dns-query
  fallback:
  - https://cloudflare-dns.com/dns-query
  default-nameserver:
  - 8.8.8.8
  - 8.8.4.4
  listen: 0.0.0.0:7874
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
