proxy-providers:
  AKUN-VPN:
    type: file
    path: "akun.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 30
  MULTI-AKUN:
    type: file
    path: "multiakun.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 30
  TES-BUGS:
    type: file
    path: "tesbug.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 30
proxy-groups:
- name: GLOBAL 🌏
  type: select
  disable-udp: false
  proxies:
  - AUTO🔁
  - PING+🚥
  - SELECT📌
  - DIRECT
  url: http://www.gstatic.com/generate_204
  interval: '120'
# Fail over
- name: AUTO🔁
  type: fallback
  disable-udp: false
  use:
  - MULTI-AKUN
  url: http://www.gstatic.com/generate_204
  interval: '300'
# Best ping
- name: PING+🚥
  type: url-test
  disable-udp: false
  use:
  - AKUN-VPN
  url: http://cp.cloudflare.com/generate_204
  interval: 60
- name: TESBUG🔥
  type: fallback
  disable-udp: false
  use:
  - TES-BUGS
  url: http://www.gstatic.com/generate_204
  interval: '300'
# Selector
- name: SELECT📌
  type: select
  disable-udp: false
  use:
  - AKUN-VPN
  - MULTI-AKUN
  url: http://www.gstatic.com/generate_204
  interval: '120'
rules:
- IP-CIDR,198.18.0.1/16,REJECT,no-resolve
- MATCH,GLOBAL 🌏
